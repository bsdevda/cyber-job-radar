name: Daily Cybersecurity Job Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Europe/Berlin"

permissions:
  contents: write

concurrency:
  group: cyber-job-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-score-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect and score jobs
        run: python -m src.main

      - name: Commit updated radar data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/seen_jobs.json data/job_history.json data/source_health.json data/weekly_analytics.json reports/latest.md reports/latest.json reports/chatgpt_handoff.json reports/weekly.md reports/archive/
          if git diff --cached --quiet; then
            echo "No radar changes to commit."
          else
            git commit -m "chore: update daily cybersecurity job radar"
            git push
          fi
